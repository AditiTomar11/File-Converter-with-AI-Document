server:
  port: ${PORT:8080}

spring:
  application:
    name: ai-document-converter-app

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aidocconverter}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

openai:
  # Leave empty to boot without an API key: the Q&A endpoint then returns a
  # clean 502 instead of the whole app failing to start.
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:llama-3.3-70b-versatile}
  base-url: ${OPENAI_BASE_URL:https://api.groq.com/openai/v1/chat/completions}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  chunk-size: ${CHUNK_SIZE:1000}
  max-context-chunks: ${MAX_CONTEXT_CHUNKS:8}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
