services:
  postgres:
    image: postgres:16-alpine
    container_name: aidocconverter-db
    environment:
      POSTGRES_DB: aidocconverter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aidocconverter-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aidocconverter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aidocconverter-pgdata:
